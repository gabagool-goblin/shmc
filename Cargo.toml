[package]
name = "shmc"
version = "0.3.1"
edition = "2021"
rust-version = "1.88"
description = "A terminal music player for Plex, inspired by rmpc"
license = "BSD-3-Clause"
repository = "https://github.com/gabagool-goblin/shmc"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "process", "io-util", "fs", "signal"] }
ratatui = "0.29"
crossterm = "0.28"
ratatui-image = "4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
quick-xml = { version = "0.42", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
image = "0.25"
url = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
libc = "0.2"
unicode-width = "0.2"
unicode-normalization = "0.1"

[lints.clippy]
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
